		<script>

			Math.TAU = Math.PI*2;
			Math.PIHALF = Math.PI/2;
			Math.WORLDANGLE = Math.PI * 1.5; // Shouldn't really need this but...

			Object.freeze(performance);
			Object.freeze(Date);
			Object.freeze(requestAnimationFrame);
			Object.freeze(setTimeout);
			Object.freeze(setInterval);

			// Force focus on first load
			window.focus();

			// Gamepad override for pov hat?
			const ggp = navigator.getGamepads.bind(navigator);

			navigator.getGamepads = () => {
				let gps = ggp();

				return gps.map(g => {

					if(!g) {
						return null;
					}

					if(g.id.includes("Wheel")) {
						g.isWheel = true;
					}

					if(g.id[0] == "G" && g.id[1] == "9" && g.axes.length == 10 && g.buttons.length == 18) {

						g.isLogiWheel = true;

						return new Proxy(g,  {
							get(target, property) {

								if(property === "buttons") {
									const buttons = Array.from(target.buttons);
									
									let pov = target.axes[9];

						
									/*
								
										NEUTRAL: 1.28571
										UP: -1
										UPRIGHT: -0.71429
										RIGHT: -0.42857
										DOWNRIGHT: -0.14286
										DOWN: 0.14286
										DOWNLEFT: 0.42857
										LEFT: 0.71429
										UPLEFT: 1

									*/


									let povNeutral = pov > 1.2;
									let up = !povNeutral && (pov < -0.5 || pov > 0.75);
									let down = !povNeutral && (pov > -0.25 && pov < 0.5);
									let left = !povNeutral && (pov > 0.25);
									let right = !povNeutral && (pov  < 0 && pov > -0.8)

									buttons.push(
										{
											pressed: up,
											touched: up,
											value: up ? 1 : 0
										},
										{
											pressed: down,
											touched: down,
											value: down ? 1 : 0
										},
										{
											pressed: left,
											touched: left,
											value: left ? 1 : 0
										},
										{
											pressed: right,
											touched: right,
											value: right ? 1 : 0
										},
									)

									return buttons;
								}

								if(property === "axes") {
									let axes = Array.from(target.axes);
									if(axes.length == 10) {
										axes.pop();
									}
									return axes;
								}

								return Reflect.get(target, property);
							}
						})
					} else {
						return g;
					}


				});

			}
			
		</script>
